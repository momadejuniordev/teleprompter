<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teleprompt Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121212" />

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #f5f5f7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, rgba(16, 36, 74, 0.35), transparent 24%),
        linear-gradient(180deg, #02030a 0%, #090b13 48%, #05080f 100%);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    body {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      padding: 16px;
      min-height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 18px;
      border-radius: 24px;
      background: rgba(16, 24, 44, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .sidebar h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: -0.03em;
    }

    .sidebar p {
      margin: 10px 0 0;
      color: #b8c1d3;
      line-height: 1.6;
    }

    .panel {
      display: grid;
      gap: 12px;
    }

    .panel label {
      display: block;
      margin-bottom: 8px;
      color: #9aa4be;
      font-size: 0.95rem;
    }

    .textarea-wrapper {
      position: relative;
      flex: 1;
      min-height: 260px;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: none;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 10, 26, 0.95);
      color: #f7f7fb;
      padding: 16px;
      line-height: 1.7;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .textarea-hint {
      margin-top: 8px;
      color: #7f8ebf;
      font-size: 0.9rem;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action-grid button,
    .control-row button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      background: linear-gradient(180deg, #1d264d 0%, #10172e 100%);
      color: #f7f8ff;
      cursor: pointer;
      transition: transform 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
    }

    .action-grid button:hover,
    .control-row button:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, #2a3b71 0%, #17234b 100%);
    }

    .control-row {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr 1fr;
    }

    .range-control {
      display: grid;
      gap: 8px;
    }

    input[type='range'] {
      width: 100%;
      cursor: pointer;
    }

    .stage {
      position: relative;
      min-height: calc(100vh - 32px);
      border-radius: 28px;
      overflow: hidden;
      background: #04060c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.45);
      display: grid;
      align-items: center;
      justify-items: center;
    }

    .stage::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.45));
      pointer-events: none;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.05) brightness(0.95);
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 50%, rgba(2, 7, 18, 0.45) 95%);
    }

    .teleprompt-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .teleprompt {
      position: absolute;
      left: 50%;
      top: 100%;
      width: calc(100% - 80px);
      max-width: 1100px;
      transform: translate(-50%, 0);
      padding: 0 18px;
      text-align: center;
      font-size: 42px;
      line-height: 1.4;
      font-weight: 600;
      white-space: pre-wrap;
      color: #f8fbff;
      text-shadow: 0 16px 30px rgba(0, 0, 0, 0.56), 0 0 30px rgba(0, 0, 0, 0.32);
      letter-spacing: -0.03em;
      pointer-events: none;
      transition: font-size 0.2s ease, line-height 0.2s ease;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(4, 8, 20, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #c8d0e3;
    }

    .status-bar span {
      font-size: 0.95rem;
    }

    .recording-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4655;
      box-shadow: 0 0 14px rgba(255, 70, 85, 0.45);
      animation: blink 1.1s infinite ease-in-out;
      display: inline-block;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.2; }
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1100px) {
      body {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .sidebar {
        order: 2;
      }

      .stage {
        min-height: 72vh;
      }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <h1>Teleprompt Pro</h1>
      <p>Modo profissional de teleprompter com rolagem suave, câmera ao vivo, gravação e controles avançados.</p>
    </div>

    <div class="panel textarea-wrapper">
      <label for="textInput">Roteiro</label>
      <textarea id="textInput" aria-label="Editor de roteiro">
Este é o seu teleprompt.

Leia com calma.
Fale com confiança.
Este vídeo foi gravado diretamente do navegador.
      </textarea>
      <p class="textarea-hint">Digite ou cole seu script. Use Enter para pular linhas.</p>
    </div>

    <div class="panel control-row">
      <button id="play">Play</button>
      <button id="reset">Reiniciar</button>
      <button id="mirror">Espelhar texto</button>
      <button id="fullscreen">Tela cheia</button>
    </div>

    <div class="panel action-grid">
      <button id="record">Gravar</button>
      <button id="flipCam">Trocar câmera</button>
    </div>

    <div class="panel">
      <div class="range-control">
        <label for="speed">Velocidade</label>
        <input id="speed" type="range" min="0.4" max="3.5" step="0.1" value="1.2" />
        <span id="speedValue">1.20x</span>
      </div>
      <div class="range-control">
        <label for="fontSize">Tamanho da fonte</label>
        <input id="fontSize" type="range" min="28" max="92" step="2" value="42" />
        <span id="fontValue">42px</span>
      </div>
      <div class="range-control">
        <label for="lineHeight">Altura da linha</label>
        <input id="lineHeight" type="range" min="1.1" max="1.9" step="0.05" value="1.35" />
        <span id="lineHeightValue">1.35</span>
      </div>
    </div>

    <div class="panel status-bar">
      <span id="scriptInfo">0 palavras • 0 linhas</span>
      <span id="shortcutInfo">Atalhos: Space / F / M</span>
    </div>
  </aside>

  <section class="stage">
    <video id="camera" autoplay muted playsinline></video>
    <div class="overlay"></div>
    <div class="teleprompt-wrapper">
      <div id="teleprompt" class="teleprompt"></div>
    </div>

    <div class="status-bar" style="position: absolute; bottom: 18px; left: 18px; right: 18px;">
      <div>
        <span id="progressLabel">Progresso:</span>
        <strong id="progressPercent">0%</strong>
      </div>
      <div id="recordStatus" class="hidden">
        <span class="recording-indicator"></span>
        <span id="recordTimer">00:00</span>
      </div>
    </div>
  </section>

  <script>
    const video = document.createElement('video');
    const liveVideo = document.getElementById('camera');
    const cameraStage = document.querySelector('.stage');
    const teleprompt = document.getElementById('teleprompt');
    const textInput = document.getElementById('textInput');

    const playBtn = document.getElementById('play');
    const resetBtn = document.getElementById('reset');
    const mirrorBtn = document.getElementById('mirror');
    const fullscreenBtn = document.getElementById('fullscreen');
    const recordBtn = document.getElementById('record');
    const flipBtn = document.getElementById('flipCam');
    const speedInput = document.getElementById('speed');
    const fontSizeInput = document.getElementById('fontSize');
    const lineHeightInput = document.getElementById('lineHeight');

    const speedValue = document.getElementById('speedValue');
    const fontValue = document.getElementById('fontValue');
    const lineHeightValue = document.getElementById('lineHeightValue');
    const scriptInfo = document.getElementById('scriptInfo');
    const progressPercent = document.getElementById('progressPercent');
    const recordStatus = document.getElementById('recordStatus');
    const recordTimer = document.getElementById('recordTimer');

    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let scrollPosition = 0;
    let lastFrameTime = 0;
    let playing = false;
    let mirrored = false;
    let scrollSpeed = Number(speedInput.value);
    let currentFontSize = Number(fontSizeInput.value);
    let currentLineHeight = Number(lineHeightInput.value);
    let facingMode = 'user';
    let seconds = 0;
    let timerId = null;

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
        liveVideo.srcObject = stream;
        liveVideo.play();
        setupRecorder(stream);
      } catch (error) {
        console.error('Erro ao iniciar a câmera:', error);
      }
    }

    function setupRecorder(cameraStream) {
      if (!window.MediaRecorder) {
        recordBtn.disabled = true;
        recordBtn.textContent = 'Gravação indisponível';
        return;
      }

      mediaRecorder = new MediaRecorder(cameraStream);
      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'teleprompt-recording.webm';
        link.click();
        URL.revokeObjectURL(url);
        recordedChunks = [];
        recordStatus.classList.add('hidden');
        clearInterval(timerId);
        seconds = 0;
        recordTimer.textContent = '00:00';
        recordBtn.textContent = 'Gravar';
      };
    }

    function formatTime(value) {
      return String(value).padStart(2, '0');
    }

    function updateTimer() {
      seconds += 1;
      const minutes = formatTime(Math.floor(seconds / 60));
      const remainder = formatTime(seconds % 60);
      recordTimer.textContent = `${minutes}:${remainder}`;
    }

    function renderTeleprompt() {
      const text = textInput.value.trim() || 'Insira seu roteiro aqui para iniciar o teleprompter.';
      teleprompt.textContent = text;
      teleprompt.style.fontSize = `${currentFontSize}px`;
      teleprompt.style.lineHeight = currentLineHeight;
      teleprompt.style.transform = `translate(-50%, -${scrollPosition}px) ${mirrored ? 'scaleX(-1)' : ''}`;
      updateScriptInfo();
    }

    function updateScriptInfo() {
      const text = textInput.value.trim();
      const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
      const lines = text ? text.split('\n').length : 0;
      scriptInfo.textContent = `${words} palavras • ${lines} linhas`;
    }

    function getScrollLimit() {
      const viewportHeight = cameraStage.clientHeight;
      return Math.max(0, teleprompt.scrollHeight + viewportHeight * 0.25);
    }

    function updateProgress() {
      const limit = getScrollLimit();
      const percent = limit ? Math.min(100, Math.round((scrollPosition / limit) * 100)) : 0;
      progressPercent.textContent = `${percent}%`;
    }

    function resetScroll() {
      scrollPosition = 0;
      renderTeleprompt();
      updateProgress();
      if (!playing) {
        playBtn.textContent = 'Play';
      }
    }

    function togglePlay() {
      if (!playing) {
        if (scrollPosition >= getScrollLimit()) {
          scrollPosition = 0;
        }
        playing = true;
        playBtn.textContent = 'Pausar';
      } else {
        playing = false;
        playBtn.textContent = 'Play';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function animate(time) {
      if (!lastFrameTime) {
        lastFrameTime = time;
      }

      const delta = time - lastFrameTime;
      lastFrameTime = time;

      if (playing) {
        const scrollSpeedPx = scrollSpeed * 0.045;
        scrollPosition = Math.min(scrollPosition + scrollSpeedPx * delta, getScrollLimit());
        renderTeleprompt();
        updateProgress();

        if (scrollPosition >= getScrollLimit()) {
          playing = false;
          playBtn.textContent = 'Play';
        }
      }

      requestAnimationFrame(animate);
    }

    playBtn.addEventListener('click', () => {
      renderTeleprompt();
      togglePlay();
    });

    resetBtn.addEventListener('click', resetScroll);

    mirrorBtn.addEventListener('click', () => {
      mirrored = !mirrored;
      mirrorBtn.textContent = mirrored ? 'Espelho: On' : 'Espelho texto';
      renderTeleprompt();
    });

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    speedInput.addEventListener('input', event => {
      scrollSpeed = Number(event.target.value);
      speedValue.textContent = `${scrollSpeed.toFixed(2)}x`;
    });

    fontSizeInput.addEventListener('input', event => {
      currentFontSize = Number(event.target.value);
      fontValue.textContent = `${currentFontSize}px`;
      renderTeleprompt();
    });

    lineHeightInput.addEventListener('input', event => {
      currentLineHeight = Number(event.target.value);
      lineHeightValue.textContent = currentLineHeight.toFixed(2);
      renderTeleprompt();
    });

    textInput.addEventListener('input', () => {
      renderTeleprompt();
    });

    flipBtn.addEventListener('click', () => {
      facingMode = facingMode === 'user' ? { exact: 'environment' } : 'user';
      startCamera();
    });

    recordBtn.addEventListener('click', () => {
      if (!mediaRecorder) {
        return;
      }

      if (mediaRecorder.state === 'inactive') {
        mediaRecorder.start();
        recordStatus.classList.remove('hidden');
        timerId = setInterval(updateTimer, 1000);
        recordBtn.textContent = 'Parar';
      } else if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    });

    document.addEventListener('keydown', event => {
      if (event.target.matches('textarea')) {
        return;
      }

      if (event.code === 'Space') {
        event.preventDefault();
        renderTeleprompt();
        togglePlay();
      }

      if (event.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }

      if (event.key.toLowerCase() === 'm') {
        mirrored = !mirrored;
        mirrorBtn.textContent = mirrored ? 'Espelho: On' : 'Espelho texto';
        renderTeleprompt();
      }
    });

    window.addEventListener('load', () => {
      renderTeleprompt();
      updateScriptInfo();
      updateProgress();
      startCamera();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registrado:', reg.scope))
          .catch(err => console.warn('Falha ao registrar SW:', err));
      }
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
