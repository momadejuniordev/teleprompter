<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teleprompt Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#121212" />

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #090b14;
      color: #eef2ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, rgba(19, 36, 84, 0.25), transparent 24%),
        linear-gradient(180deg, #07090f 0%, #0d1220 48%, #05070f 100%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    body {
      min-height: 100vh;
    }

    .app-shell {
      position: relative;
      min-height: 100vh;
    }

    .topbar {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 20px;
      background: rgba(7, 11, 20, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }

    .topbar strong {
      display: block;
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    .topbar p {
      margin: 6px 0 0;
      color: #9ba7cf;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .stage {
      position: relative;
      width: calc(100% - 32px);
      margin: 88px 16px 112px;
      min-height: calc(100vh - 220px);
      border-radius: 30px;
      overflow: hidden;
      background: #05070d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.32);
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.05) brightness(0.95);
    }

    .stage-mask {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 10, 22, 0.04) 0%, rgba(1, 2, 8, 0.16) 60%, rgba(1, 2, 8, 0.28) 100%);
      pointer-events: none;
    }

    .teleprompt {
      position: absolute;
      left: 50%;
      width: 80%;
      max-width: 920px;
      padding: 14px 18px;
      color: #f8fbff;
      text-align: center;
      line-height: 1.5;
      font-weight: 700;
      letter-spacing: -0.03em;
      text-shadow: 0 16px 30px rgba(0, 0, 0, 0.52), 0 0 20px rgba(255, 255, 255, 0.08);
      transform: translate(-50%, 0);
      transition: top 0.2s ease, width 0.18s ease, opacity 0.18s ease, background 0.18s ease;
      white-space: pre-wrap;
      pointer-events: none;
    }

    .teleprompt[data-theme="dark"] {
      background: rgba(8, 12, 26, 0.76);
      border-radius: 24px;
    }

    .teleprompt[data-theme="light"] {
      background: rgba(248, 250, 253, 0.88);
      color: #111827;
    }

    .teleprompt[data-theme="none"] {
      background: transparent;
      padding: 0;
      text-shadow: 0 18px 36px rgba(0, 0, 0, 0.7);
    }

    .teleprompt[data-position="top"] {
      top: 58%;
    }

    .teleprompt[data-position="center"] {
      top: 80%;
    }

    .teleprompt[data-position="bottom"] {
      top: 92%;
    }

    .stage-footer {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      z-index: 15;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(8, 13, 25, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #e8edf8;
      font-size: 0.95rem;
      backdrop-filter: blur(14px);
    }

    .record-indicator {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #ff4d64;
      box-shadow: 0 0 16px rgba(255, 77, 100, 0.45);
      animation: blink 1.2s infinite ease-in-out;
    }

    .hidden {
      display: none !important;
    }

    .bottom-bar {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      z-index: 20;
    }

    .control-btn {
      border: none;
      border-radius: 16px;
      padding: 14px 12px;
      background: rgba(9, 14, 26, 0.96);
      color: #eef2ff;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.16);
    }

    .control-btn:hover {
      transform: translateY(-1px);
      background: rgba(19, 30, 56, 0.96);
    }

    .control-btn.primary {
      background: linear-gradient(180deg, #3e6ff4 0%, #1d4dce 100%);
      color: #fff;
    }

    .control-btn.record {
      background: linear-gradient(180deg, #eb3851 0%, #c61a39 100%);
      color: #fff;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(6, 11, 20, 0.86);
      backdrop-filter: blur(18px);
    }

    .modal.hidden {
      display: none;
    }

    .modal-card {
      width: min(560px, 100%);
      max-height: min(92vh, 100%);
      overflow: auto;
      padding: 22px;
      border-radius: 24px;
      background: rgba(11, 16, 28, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.32);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.25rem;
      line-height: 1.2;
    }

    .modal-header p {
      margin: 6px 0 0;
      color: #98a7cc;
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .icon-close {
      border: none;
      background: none;
      color: #eef2ff;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 6px 10px;
    }

    .setting-group {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .range-row input[type='range'] {
      flex: 1;
      accent-color: #5a7ff5;
    }

    .range-row span {
      min-width: 60px;
      text-align: right;
      color: #c7d0eb;
      font-size: 0.95rem;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .option-btn {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(12, 18, 34, 0.92);
      color: #eef2ff;
      padding: 12px 14px;
      cursor: pointer;
      transition: border-color 0.18s ease, background 0.18s ease;
      text-align: center;
    }

    .option-btn:hover {
      background: rgba(24, 35, 64, 0.98);
      border-color: rgba(90, 124, 244, 0.45);
    }

    .option-btn.active {
      background: rgba(63, 100, 255, 0.95);
      border-color: rgba(139, 178, 255, 0.88);
      color: #fff;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(4, 10, 24, 0.96);
      color: #eef2ff;
      padding: 16px;
      line-height: 1.7;
      font-size: 1rem;
      outline: none;
    }

    .script-summary {
      margin-top: 16px;
      color: #9ba5c6;
      font-size: 0.92rem;
    }

    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: 0.2; }
    }

    @media (max-width: 760px) {
      .topbar {
        flex-wrap: wrap;
        gap: 10px;
        padding: 14px;
      }

      .stage {
        margin: 92px 12px 146px;
      }

      .bottom-bar {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="openScript" class="control-btn">Script</button>
      <div>
        <strong>Teleprompt Pro</strong>
        <p>Leitura profissional com câmera ao vivo</p>
      </div>
      <button id="openSettings" class="control-btn">Ajustes</button>
    </header>

    <main class="stage">
      <video id="camera" autoplay muted playsinline></video>
      <div class="stage-mask"></div>
      <div id="teleprompt" class="teleprompt" data-theme="dark" data-position="center"></div>
      <div class="stage-footer">
        <div class="status-pill">
          <span id="recordIndicator" class="record-indicator hidden"></span>
          <span id="recordTimer">00:00</span>
        </div>
        <div class="status-pill">
          <span>Progresso</span>
          <strong id="progressPercent">0%</strong>
        </div>
      </div>
    </main>

    <nav class="bottom-bar">
      <button id="openScriptBottom" class="control-btn">Script</button>
      <button id="play" class="control-btn primary">Play</button>
      <button id="record" class="control-btn record">Gravar</button>
      <button id="mirror" class="control-btn">Espelhar</button>
      <button id="flipCam" class="control-btn">Câmera</button>
    </nav>

    <div id="settingsPanel" class="modal hidden">
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <h2>Ajustes</h2>
            <p>Personalize o texto do teleprompter e os controles de leitura.</p>
          </div>
          <button id="closeSettings" class="icon-close">Fechar</button>
        </div>

        <div class="setting-group">
          <label for="speed">Velocidade</label>
          <div class="range-row">
            <input id="speed" type="range" min="0.4" max="3.5" step="0.1" value="1.2" />
            <span id="speedValue">1.20x</span>
          </div>
        </div>

        <div class="setting-group">
          <label for="fontSize">Tamanho da fonte</label>
          <div class="range-row">
            <input id="fontSize" type="range" min="24" max="96" step="2" value="42" />
            <span id="fontValue">42px</span>
          </div>
        </div>

        <div class="setting-group">
          <label for="areaWidth">Largura do texto</label>
          <div class="range-row">
            <input id="areaWidth" type="range" min="55" max="95" step="1" value="80" />
            <span id="areaValue">80%</span>
          </div>
        </div>

        <div class="setting-group">
          <label for="transparency">Transparência</label>
          <div class="range-row">
            <input id="transparency" type="range" min="0.4" max="1" step="0.05" value="0.92" />
            <span id="transparencyValue">92%</span>
          </div>
        </div>

        <div class="setting-group">
          <label>Fundo do teleprompter</label>
          <div class="button-row">
            <button type="button" data-theme="none" class="option-btn active">Nenhum</button>
            <button type="button" data-theme="dark" class="option-btn">Escuro</button>
            <button type="button" data-theme="light" class="option-btn">Claro</button>
          </div>
        </div>

        <div class="setting-group">
          <label>Posição do texto</label>
          <div class="button-row">
            <button type="button" data-position="top" class="option-btn">Topo</button>
            <button type="button" data-position="center" class="option-btn active">Centro</button>
            <button type="button" data-position="bottom" class="option-btn">Baixo</button>
          </div>
        </div>
      </div>
    </div>

    <div id="scriptPanel" class="modal hidden">
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <h2>Roteiro</h2>
            <p>Edite o texto do teleprompter antes de iniciar a leitura.</p>
          </div>
          <button id="closeScript" class="icon-close">Fechar</button>
        </div>

        <textarea id="textInput" aria-label="Editor de roteiro">Este é o seu teleprompt.

Leia com calma.
Fale com confiança.
Este vídeo foi gravado diretamente do navegador.</textarea>

        <div class="script-summary">
          <span id="scriptInfo">0 palavras • 0 linhas</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const cameraVideo = document.getElementById('camera');
    const teleprompt = document.getElementById('teleprompt');
    const textInput = document.getElementById('textInput');
    const cameraStage = document.querySelector('.stage');

    const openSettingsBtn = document.getElementById('openSettings');
    const closeSettingsBtn = document.getElementById('closeSettings');
    const openScriptBtn = document.getElementById('openScript');
    const openScriptBottomBtn = document.getElementById('openScriptBottom');
    const closeScriptBtn = document.getElementById('closeScript');
    const playBtn = document.getElementById('play');
    const recordBtn = document.getElementById('record');
    const mirrorBtn = document.getElementById('mirror');
    const flipBtn = document.getElementById('flipCam');
    const speedInput = document.getElementById('speed');
    const fontSizeInput = document.getElementById('fontSize');
    const areaInput = document.getElementById('areaWidth');
    const transparencyInput = document.getElementById('transparency');
    const themeButtons = document.querySelectorAll('[data-theme]');
    const positionButtons = document.querySelectorAll('[data-position]');

    const speedValue = document.getElementById('speedValue');
    const fontValue = document.getElementById('fontValue');
    const areaValue = document.getElementById('areaValue');
    const transparencyValue = document.getElementById('transparencyValue');
    const scriptInfo = document.getElementById('scriptInfo');
    const progressPercent = document.getElementById('progressPercent');
    const recordIndicator = document.getElementById('recordIndicator');
    const recordTimer = document.getElementById('recordTimer');
    const settingsPanel = document.getElementById('settingsPanel');
    const scriptPanel = document.getElementById('scriptPanel');

    let stream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let scrollPosition = 0;
    let lastFrameTime = 0;
    let playing = false;
    let mirrored = false;
    let scrollSpeed = Number(speedInput.value);
    let fontSize = Number(fontSizeInput.value);
    let textAreaWidth = Number(areaInput.value);
    let textTransparency = Number(transparencyInput.value);
    let theme = 'none';
    let textPosition = 'bottom';
    let facingMode = 'user';
    let seconds = 0;
    let timerId = null;

    function openModal(modal) {
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(modal) {
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function updateThemeButtons() {
      themeButtons.forEach(button => {
        button.classList.toggle('active', button.dataset.theme === theme);
      });
    }

    function updatePositionButtons() {
      positionButtons.forEach(button => {
        button.classList.toggle('active', button.dataset.position === textPosition);
      });
    }

    function setTheme(themeName) {
      theme = themeName;
      updateThemeButtons();
      renderTeleprompt();
    }

    function setTextPosition(positionName) {
      textPosition = positionName;
      updatePositionButtons();
      renderTeleprompt();
    }

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
        cameraVideo.srcObject = stream;
        cameraVideo.play();
        setupRecorder(stream);
      } catch (error) {
        console.warn('O navegador não permitiu a câmera:', error);
      }
    }

    function setupRecorder(cameraStream) {
      if (!window.MediaRecorder) {
        recordBtn.disabled = true;
        recordBtn.textContent = 'Gravação indisponível';
        return;
      }

      mediaRecorder = new MediaRecorder(cameraStream);
      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'teleprompt-recording.webm';
        link.click();
        URL.revokeObjectURL(url);
        recordedChunks = [];
        recordIndicator.classList.add('hidden');
        clearInterval(timerId);
        seconds = 0;
        recordTimer.textContent = '00:00';
        recordBtn.textContent = 'Gravar';
      };
    }

    function formatTime(value) {
      return String(value).padStart(2, '0');
    }

    function updateTimer() {
      seconds += 1;
      const minutes = formatTime(Math.floor(seconds / 60));
      const remainder = formatTime(seconds % 60);
      recordTimer.textContent = `${minutes}:${remainder}`;
    }

    function getBaseTop() {
      if (textPosition === 'top') return '58%';
      if (textPosition === 'bottom') return '92%';
      return '88%';
    }

    function renderTeleprompt() {
      const text = textInput.value.trim() || 'Insira seu roteiro aqui e toque em Play para iniciar.';
      teleprompt.textContent = text;
      teleprompt.style.fontSize = `${fontSize}px`;
      teleprompt.style.width = `${textAreaWidth}%`;
      teleprompt.style.opacity = textTransparency;
      teleprompt.dataset.theme = theme;
      teleprompt.dataset.position = textPosition;
      teleprompt.style.top = getBaseTop();
      teleprompt.style.transform = `translate(-50%, -${scrollPosition}px) ${mirrored ? 'scaleX(-1)' : ''}`;
      updateScriptInfo();
    }

    function updateScriptInfo() {
      const text = textInput.value.trim();
      const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
      const lines = text ? text.split('\n').length : 0;
      scriptInfo.textContent = `${words} palavras • ${lines} linhas`;
    }

    function getScrollLimit() {
      const viewportHeight = cameraStage.clientHeight;
      return Math.max(0, teleprompt.scrollHeight + viewportHeight * 0.3);
    }

    function updateProgress() {
      const limit = getScrollLimit();
      const percent = limit ? Math.min(100, Math.round((scrollPosition / limit) * 100)) : 0;
      progressPercent.textContent = `${percent}%`;
    }

    function resetScroll() {
      scrollPosition = 0;
      renderTeleprompt();
      updateProgress();
      if (!playing) playBtn.textContent = 'Play';
    }

    function togglePlay() {
      if (!playing) {
        if (scrollPosition >= getScrollLimit()) scrollPosition = 0;
        playing = true;
        playBtn.textContent = 'Pausar';
      } else {
        playing = false;
        playBtn.textContent = 'Play';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function animate(time) {
      if (!lastFrameTime) lastFrameTime = time;
      const delta = time - lastFrameTime;
      lastFrameTime = time;

      if (playing) {
        const speedPx = scrollSpeed * 0.045;
        scrollPosition = Math.min(scrollPosition + speedPx * delta, getScrollLimit());
        renderTeleprompt();
        updateProgress();

        if (scrollPosition >= getScrollLimit()) {
          playing = false;
          playBtn.textContent = 'Play';
        }
      }

      requestAnimationFrame(animate);
    }

    openSettingsBtn.addEventListener('click', () => openModal(settingsPanel));
    closeSettingsBtn.addEventListener('click', () => closeModal(settingsPanel));
    openScriptBtn.addEventListener('click', () => openModal(scriptPanel));
    openScriptBottomBtn.addEventListener('click', () => openModal(scriptPanel));
    closeScriptBtn.addEventListener('click', () => closeModal(scriptPanel));

    playBtn.addEventListener('click', () => {
      renderTeleprompt();
      togglePlay();
    });

    recordBtn.addEventListener('click', () => {
      if (!mediaRecorder) return;
      if (!playing) {
        renderTeleprompt();
        togglePlay();
      }
      if (mediaRecorder.state === 'inactive') {
        mediaRecorder.start();
        recordIndicator.classList.remove('hidden');
        timerId = setInterval(updateTimer, 1000);
        recordBtn.textContent = 'Parar';
      } else if (mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    });

    mirrorBtn.addEventListener('click', () => {
      mirrored = !mirrored;
      mirrorBtn.textContent = mirrored ? 'Espelho: On' : 'Espelhar';
      renderTeleprompt();
    });

    flipBtn.addEventListener('click', () => {
      facingMode = facingMode === 'user' ? { exact: 'environment' } : 'user';
      startCamera();
    });

    speedInput.addEventListener('input', event => {
      scrollSpeed = Number(event.target.value);
      speedValue.textContent = `${scrollSpeed.toFixed(1)}x`;
    });

    fontSizeInput.addEventListener('input', event => {
      fontSize = Number(event.target.value);
      fontValue.textContent = `${fontSize}px`;
      renderTeleprompt();
    });

    areaInput.addEventListener('input', event => {
      textAreaWidth = Number(event.target.value);
      areaValue.textContent = `${textAreaWidth}%`;
      renderTeleprompt();
    });

    transparencyInput.addEventListener('input', event => {
      textTransparency = Number(event.target.value);
      transparencyValue.textContent = `${Math.round(textTransparency * 100)}%`;
      renderTeleprompt();
    });

    themeButtons.forEach(button => {
      button.addEventListener('click', () => setTheme(button.dataset.theme));
    });

    positionButtons.forEach(button => {
      button.addEventListener('click', () => setTextPosition(button.dataset.position));
    });

    textInput.addEventListener('input', () => {
      renderTeleprompt();
    });

    document.addEventListener('keydown', event => {
      if (event.target.tagName === 'TEXTAREA') return;
      if (event.code === 'Space') {
        event.preventDefault();
        renderTeleprompt();
        togglePlay();
      }
      if (event.key.toLowerCase() === 'f') toggleFullscreen();
      if (event.key.toLowerCase() === 'm') {
        mirrored = !mirrored;
        mirrorBtn.textContent = mirrored ? 'Espelho: On' : 'Espelhar';
        renderTeleprompt();
      }
    });

    window.addEventListener('load', () => {
      renderTeleprompt();
      updateScriptInfo();
      updateProgress();
      startCamera();
      requestAnimationFrame(animate);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registrado:', reg.scope))
          .catch(err => console.warn('Falha ao registrar SW:', err));
      }
    });
  </script>
</body>
</html>
